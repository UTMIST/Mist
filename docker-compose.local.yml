# Standalone local NVIDIA demo. Fixed workloads run inside the app container;
# no host Docker socket is mounted.
services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - local_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "127.0.0.1:5173:3000"
    environment:
      MIST_REDIS_ADDR: redis:6379
      MIST_GPU_TYPE: NVIDIA
    mem_limit: 4g
    cpus: 4
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
volumes:
  local_redis_data:
