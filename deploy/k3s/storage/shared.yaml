apiVersion: v1
kind: PersistentVolume
metadata:
  name: mist-shared-api
spec:
  capacity:
    storage: 1600Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: mist-shared-api
    namespace: mist-system
  mountOptions: [nfsvers=4.2, hard, timeo=100, retrans=2]
  nfs:
    server: 10.0.0.112
    path: /srv/mist-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mist-shared-api
  namespace: mist-system
spec:
  storageClassName: ""
  volumeName: mist-shared-api
  accessModes: [ReadWriteMany]
  resources:
    requests:
      # Existing static NFS claim size stays unchanged; actual capacity is in PV/statfs.
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mist-shared-jobs
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: mist-shared-jobs
    namespace: mist
  mountOptions: [nfsvers=4.2, hard, timeo=100, retrans=2]
  nfs:
    server: 10.0.0.112
    path: /srv/mist-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mist-shared-jobs
  namespace: mist
spec:
  storageClassName: ""
  volumeName: mist-shared-jobs
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 100Gi
