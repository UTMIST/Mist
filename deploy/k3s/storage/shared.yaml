apiVersion: v1
kind: PersistentVolume
metadata:
  name: mist-folder-api
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: mist-folder-api
    namespace: mist-system
  mountOptions: [nfsvers=4.1, hard, timeo=100, retrans=2]
  nfs:
    server: 192.168.240.2
    path: /srv/mist-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mist-folder-api
  namespace: mist-system
spec:
  storageClassName: ""
  volumeName: mist-folder-api
  accessModes: [ReadWriteMany]
  resources:
    requests:
      # Static NFS binding declaration, not a quota. API reports real disk space.
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mist-folder-jobs
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: mist-folder-jobs
    namespace: mist
  mountOptions: [nfsvers=4.1, hard, timeo=100, retrans=2]
  nfs:
    server: 192.168.240.2
    path: /srv/mist-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mist-folder-jobs
  namespace: mist
spec:
  storageClassName: ""
  volumeName: mist-folder-jobs
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
