# One per-pod claim; n300 count is boards, not individual chips.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mist-tenstorrent-1-boards
  namespace: mist
spec:
  spec:
    devices:
      requests:
      - name: boards
        exactly:
          deviceClassName: tenstorrent.com
          count: 1
          selectors:
          - cel:
              expression: device.attributes["tenstorrent.com"].boardName == "n300"
                && device.attributes["tenstorrent.com"].chipCount == 2
---
