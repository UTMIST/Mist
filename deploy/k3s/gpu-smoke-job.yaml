apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-smoke
  namespace: mist
  labels:
    app.kubernetes.io/name: mist-gpu-smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mist-gpu-smoke
    spec:
      restartPolicy: Never
      containers:
        - name: vectoradd
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              nvidia.com/gpu: 1
            limits:
              cpu: '1'
              memory: 512Mi
              nvidia.com/gpu: 1
