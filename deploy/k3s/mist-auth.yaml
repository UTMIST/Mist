apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mist-auth-data
  namespace: mist-system
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mist-auth
  namespace: mist-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mist-auth
  template:
    metadata:
      labels:
        app: mist-auth
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: utmist-z1opa08
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: mist-auth:departments-20261009
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - secretRef:
                name: mist-auth-bootstrap
          env:
            - name: MIST_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mist-internal-auth
                  key: MIST_INTERNAL_TOKEN
            - name: MIST_SITE_ORIGIN
              value: http://100.73.139.66:8088
            - name: MIST_ALLOWED_ORIGINS
              value: http://100.73.139.66:8088,http://utmist.tail459b5e.ts.net:8088,http://127.0.0.1:8088,http://127.0.0.1:3001,http://localhost:3001,https://utmist.tail459b5e.ts.net
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mist-auth-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mist-auth
  namespace: mist-system
spec:
  selector:
    app: mist-auth
  ports:
    - port: 3002
      targetPort: http
