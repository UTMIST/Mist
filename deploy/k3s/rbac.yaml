# mistd's Kubernetes permissions (executors.md#rbac): Pods and ConfigMaps in
# mist-jobs only, plus read-only nodes cluster-wide. ResourceClaims and
# ResourceSlices join in M4.
apiVersion: v1
kind: Namespace
metadata:
  name: mist-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mistd
  namespace: mist-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mistd-jobs
  namespace: mist-jobs
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mistd-jobs
  namespace: mist-jobs
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: mistd-jobs}
subjects: [{kind: ServiceAccount, name: mistd, namespace: mist-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mistd-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mistd-nodes
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: mistd-nodes}
subjects: [{kind: ServiceAccount, name: mistd, namespace: mist-system}]
