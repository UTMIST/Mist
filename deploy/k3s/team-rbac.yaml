apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mist-team-controller
rules:
  - apiGroups: [""]
    resources: [namespaces, configmaps, persistentvolumes, persistentvolumeclaims, resourcequotas]
    verbs: [get, list, create, update, patch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims, resourceclaimtemplates]
    verbs: [get, list, create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mist-team-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mist-team-controller
subjects:
  - kind: ServiceAccount
    name: mist-api
    namespace: mist-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-api-only
  namespace: mist-system
spec:
  podSelector:
    matchLabels:
      app: mist-auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mist-api
      ports:
        - protocol: TCP
          port: 3002
