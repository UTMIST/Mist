# Install as /etc/systemd/system/nginx.service.d/mist.conf.
[Unit]
StartLimitIntervalSec=0
Wants=network-online.target tailscaled.service k3s.service
After=network-online.target tailscaled.service k3s.service
[Service]
# Tailscale may need a few seconds to restore its address before bind().
Restart=on-failure
RestartSec=5
