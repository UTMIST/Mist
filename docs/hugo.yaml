baseURL: "/docs/"
title: "Mist Documentation"
defaultContentLanguage: "en"

module:
  imports:
    - path: "github.com/imfing/hextra"

markup:
  highlight:
    noClasses: false
    guessSyntax: true
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - name: "Overview"
      pageRef: "/"
      weight: 1
    - name: "Portal"
      url: "/"
      weight: 2
    - name: "GitHub"
      url: "https://github.com/UTMIST/Mist"
      weight: 3
      params:
        icon: "github"

params:
  description: "Documentation and operational guides for UTMIST's research compute platform."
  navbar:
    displayLogo: true
    logo:
      text: "Mist Docs"
    width: "max-w-7xl"
  footer:
    displayCopyright: true
    displayPoweredBy: false
  editURL:
    enable: false
  search:
    enable: true
  theme:
    default: "system"
    displayToggle: true
